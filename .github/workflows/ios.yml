name: iOS

# Builds the iOS app (ios/) and its Rust core. Produces an unsigned .ipa
# artifact that can be signed and sideloaded (see ios/README.md).

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "rslib/**"
      - "proto/**"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "rslib/**"
      - "proto/**"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Fetch translations
        run: git submodule update --init --depth 1 ftl/core-repo ftl/qt-repo

      - name: Fetch protoc
        run: |
          mkdir -p out/extracted/protoc && cd out/extracted/protoc
          curl -sSL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065  protoc.zip" | sha256sum -c
          unzip -qo protoc.zip

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-bridge-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Test bridge
        run: cargo test -p anki_ios_bridge

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build Rust core
        run: TARGETS="aarch64-apple-ios aarch64-apple-ios-sim" ios/build-rust.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild -project ios/AnkiiOS.xcodeproj -scheme AnkiiOS \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/sim ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Build for device (unsigned)
        run: |
          xcodebuild -project ios/AnkiiOS.xcodeproj -scheme AnkiiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build
          cd ios/build
          rm -rf Payload && mkdir Payload
          cp -R device/Build/Products/Release-iphoneos/AnkiiOS.app Payload/
          zip -qry Anki-unsigned.ipa Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: Anki-iOS-unsigned
          path: ios/build/Anki-unsigned.ipa
          retention-days: 30
