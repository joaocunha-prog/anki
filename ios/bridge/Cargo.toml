[package]
name = "anki_ios_bridge"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "C bridge (protobuf RPC and JSON commands) exposing Anki's Rust core to the iOS app"

[lib]
name = "anki_ios_bridge"
crate-type = ["staticlib", "rlib"]

[dependencies]
anki = { workspace = true, features = ["native-tls"] }
anki_proto.workspace = true
prost.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true

[dev-dependencies]
anki_proto_gen.workspace = true
prost-reflect.workspace = true
tempfile.workspace = true
tokio.workspace = true
